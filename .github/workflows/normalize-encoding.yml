name: Normalize website encoding

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize HTML files
        run: python scripts/normalize_encoding.py

      - name: Commit fixes when needed
        run: |
          if git diff --quiet; then
            echo "No fixes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Normalize page encoding and refresh script cache"
          git push
